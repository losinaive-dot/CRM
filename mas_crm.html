<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAS 영업 파이프라인 관리</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F766E'/%3E%3Cpath d='M14 20h36l-13 16v12l-10 5V36z' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0F766E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAS영업">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css');

  :root{
    --paper:#F4F5F3;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#4B5563;
    --line:#E1E4E1;
    --steel:#5B6B7A;
    --teal:#0F766E;
    --teal-soft:#E7F3F1;
    --a-color:#2563EB; --a-bg:#EAF1FE;
    --b-color:#B45309; --b-bg:#FDF1E1;
    --c-color:#DC2626; --c-bg:#FDEAEA;
    --drop:#8A8F98; --drop-bg:#EEEFF0;
    --radius:10px;
    --shadow: 0 1px 2px rgba(27,36,48,0.04), 0 4px 14px rgba(27,36,48,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Pretendard', -apple-system, 'Malgun Gothic', system-ui, sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{
    width:196px; flex-shrink:0;
    background:var(--ink); color:#DDE3E8;
    display:flex; flex-direction:column;
    padding:20px 12px;
    position:sticky; top:0; height:100vh;
  }
  #sidebar .brand{
    font-weight:800; font-size:15px; color:#fff;
    letter-spacing:-0.02em; padding:0 8px 18px 8px;
    display:flex; align-items:center; gap:8px;
  }
  #sidebar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal); box-shadow:0 0 0 3px rgba(15,118,110,0.35);}
  .install-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--teal); color:#fff; font-weight:800; font-size:12.5px;
    padding:9px 10px; border-radius:8px; margin:0 4px 14px; cursor:pointer;
    box-shadow:0 4px 14px rgba(15,118,110,0.35);
  }
  .install-btn:hover{opacity:0.92;}
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; border-radius:8px; margin-bottom:2px; cursor:pointer;
    color:#B7C0C9; font-weight:600; font-size:13.2px;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--teal); color:#fff;}
  .nav-item .badge{
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px;
    background:rgba(255,255,255,0.14); color:#fff;
  }
  .nav-item.active .badge{background:rgba(255,255,255,0.28);}
  .nav-section-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:#6B7684; font-weight:700; padding:14px 10px 6px;
  }
  .spec-nav{display:flex; flex-direction:column; margin:2px 0 4px 6px; padding-left:8px; border-left:2px solid rgba(255,255,255,0.1);}
  .spec-nav-item{padding:6px 10px; margin-bottom:1px; border-radius:7px; font-size:12px; font-weight:600; color:#9AA6B0; cursor:pointer;}
  .spec-nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  #sidebar .foot{margin-top:auto; padding:10px 8px 0; font-size:11px; color:#6B7684; line-height:1.5;}

  /* Main */
  #main{flex:1; min-width:0; padding:26px 30px 60px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
  .topbar h1{font-size:20px; margin:0; font-weight:800; letter-spacing:-0.02em;}
  .topbar .sub{color:var(--ink-soft); font-size:12.5px; margin-top:3px; font-weight:500;}
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  input[type=text], input[type=search], select, input[type=date], textarea{
    font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; background:#fff; color:var(--ink); outline:none;
  }
  input[type=text]:focus, select:focus, textarea:focus, input[type=date]:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  textarea{resize:vertical; width:100%; font-size:13px; line-height:1.5;}

  button{font-family:inherit; cursor:pointer; border:none; border-radius:8px; font-weight:700; font-size:13px; padding:8px 14px; transition:transform .08s ease, opacity .12s ease;}
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:#F6F7F6;}
  .btn-danger{background:var(--c-bg); color:var(--c-color);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}

  /* Dashboard */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px; margin-bottom:22px;}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); cursor:pointer;}
  .stat-card:hover{border-color:var(--teal);}
  .stat-card .label{font-size:12px; color:var(--ink-soft); font-weight:700;}
  .stat-card .num{font-size:26px; font-weight:800; margin-top:4px; letter-spacing:-0.02em;}
  .stat-card .breakdown{display:flex; gap:6px; margin-top:10px; font-size:11px; font-weight:700;}
  .pill{padding:2px 7px; border-radius:20px;}
  .pill.A{background:var(--a-bg); color:var(--a-color);}
  .pill.B{background:var(--b-bg); color:var(--b-color);}
  .pill.C{background:var(--c-bg); color:var(--c-color);}

  table.pipeline-table{width:100%; margin-top:8px; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  table.pipeline-table th{background:#F8F9F8; text-align:left; font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; border-bottom:1px solid var(--line); font-weight:700;}
  table.pipeline-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:13px;}
  table.pipeline-table tr:last-child td{border-bottom:none;}
  table.pipeline-table tbody tr{cursor:pointer;}
  table.pipeline-table tbody tr:hover{background:#FAFBFA;}
  table.pipeline-table th.stage-th{cursor:pointer; user-select:none;}
  table.pipeline-table th.stage-th:hover{background:var(--teal-soft); color:var(--teal);}
  .stage-filter-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}

  .level-tag{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-weight:800; font-size:11.5px;}
  .level-tag.A{background:var(--a-bg); color:var(--a-color);}
  .level-tag.B{background:var(--b-bg); color:var(--b-color);}
  .level-tag.C{background:var(--c-bg); color:var(--c-color);}
  .level-tag.DROP{background:var(--drop-bg); color:var(--drop);}

  .stage-track{display:flex; align-items:center; gap:3px;}
  .stage-dot{width:9px; height:9px; border-radius:50%; background:var(--line); flex-shrink:0;}
  .stage-dot.done{background:var(--teal);}
  .stage-dot.current{background:var(--teal); box-shadow:0 0 0 3px var(--teal-soft);}
  .stage-line{width:12px; height:2px; background:var(--line); flex-shrink:0;}
  .stage-line.done{background:var(--teal);}
  .stage-label-current{font-size:11.5px; font-weight:700; color:var(--teal); margin-left:6px; white-space:nowrap;}
  .dropped-label{font-size:11.5px; font-weight:700; color:var(--drop);}

  .company-name-cell{font-weight:700;}
  .company-name-cell .cat-tag{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:1px;}
  .assignee-chip{font-size:11.5px; font-weight:700; background:#F0F1EF; color:var(--ink-soft); padding:2px 8px; border-radius:20px;}
  .assignee-chip.empty{color:#B5BBC2; border:1px dashed var(--line); background:transparent;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--ink-soft); background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius);}
  .empty-state b{color:var(--ink);}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(20,26,32,0.45); display:flex; align-items:flex-start; justify-content:center; padding:36px 20px; z-index:50; overflow-y:auto;}
  .modal{background:var(--panel); width:640px; max-width:100%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.25); padding:0; overflow:hidden;}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .modal-head h2{margin:0; font-size:16.5px; font-weight:800;}
  .modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px;}
  .close-x{background:transparent; color:var(--ink-soft); font-size:18px; padding:2px 6px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .full{grid-column:1/3;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;}
  .section-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin:18px 0 8px; display:flex; align-items:center; gap:8px;}
  .section-title:first-child{margin-top:0;}
  .section-title::after{content:""; flex:1; height:1px; background:var(--line);}

  .stage-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .stage-btn{padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .stage-btn.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .level-picker{display:flex; gap:6px;}
  .level-btn{flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:800; font-size:13px;}
  .level-btn.A.active{background:var(--a-color); border-color:var(--a-color); color:#fff;}
  .level-btn.B.active{background:var(--b-color); border-color:var(--b-color); color:#fff;}
  .level-btn.C.active{background:var(--c-color); border-color:var(--c-color); color:#fff;}
  .drop-toggle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:10px;}

  .history-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
  .history-item{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-date{font-size:11.5px; font-weight:800; color:var(--teal); white-space:nowrap; padding-top:1px; width:78px; flex-shrink:0;}
  .history-text{font-size:13px; color:var(--ink); line-height:1.5; flex:1;}
  .history-del{background:none; color:#C4C9CE; font-size:11px; padding:2px 4px; flex-shrink:0;}
  .history-add{display:flex; gap:8px; margin-top:10px;}
  .history-add input[type=date]{width:130px; flex-shrink:0;}
  .history-add input[type=text]{flex:1;}

  .contact-row{display:flex; gap:16px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .contact-row b{color:var(--ink);}

  .sidebar-actions{display:flex; flex-direction:column; gap:6px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.1);}
  .sidebar-btn{background:rgba(255,255,255,0.07); color:#DDE3E8; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; text-align:left;}
  .sidebar-btn:hover{background:rgba(255,255,255,0.14);}
  .admin-badge{font-size:11px; font-weight:800; color:#6EE7B7; padding:2px 2px 4px;}
  .lock-btn{color:#F5A9A9; border-color:rgba(245,169,169,0.3);}

  .update-columns{column-count:3; column-gap:26px;}
  .update-item{break-inside:avoid; display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .update-item.clickable{cursor:pointer; border-radius:6px; margin:0 -8px; padding:9px 8px;}
  .update-item.clickable:hover{background:#F4F7F6;}
  .update-item.clickable:hover .update-company{color:var(--teal);}
  .update-date{font-size:11.5px; font-weight:800; color:var(--teal); white-space:nowrap; width:74px; flex-shrink:0; padding-top:1px;}
  .update-company{font-size:12px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:2px;}
  .update-body{font-size:13px; line-height:1.5; color:var(--ink);}
  .week-group{margin-bottom:6px;}
  .week-header{font-size:12px; font-weight:800; color:#fff; background:var(--steel); display:inline-block; padding:3px 11px; border-radius:20px; margin:14px 0 8px;}

  .search-sec{margin-bottom:22px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
  .search-row{display:flex; gap:16px; flex-wrap:wrap;}
  .search-field{flex:1; min-width:220px;}
  .search-field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .search-field input{width:100%;}
  .hist-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .hist-head select{font-size:12.5px; padding:6px 8px;}
  @media (max-width:980px){ .update-columns{column-count:2;} }
  @media (max-width:600px){ .update-columns{column-count:1;} }

  .card-preview-box{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .card-img{max-width:230px; max-height:140px; border-radius:8px; border:1px solid var(--line); display:block; object-fit:cover;}
  .card-empty{font-size:12.5px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:8px; padding:16px 20px; text-align:center; width:230px;}
  .attach-list{display:flex; flex-direction:column;}
  .attach-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .attach-item:last-child{border-bottom:none;}
  .attach-link{flex:1; font-size:13px; color:var(--teal); text-decoration:none; font-weight:600; word-break:break-all;}
  .attach-link:hover{text-decoration:underline;}
  .attach-date{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
  .attach-status{font-size:12px; color:var(--teal); font-weight:700; margin-top:6px; min-height:14px;}
  .checklist-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .ci-text{flex:1; font-size:13px;}
  .checklist-item .ci-text.done{text-decoration:line-through; color:var(--ink-soft);}
  .checklist-add{display:flex; gap:8px; margin-top:10px;}
  .checklist-add input{flex:1;}

  /* 달력 */
  .cal-toolbar{display:flex; align-items:center; gap:8px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg-btn{padding:7px 14px; font-size:12.5px; font-weight:700; background:#fff; color:var(--ink-soft); border-right:1px solid var(--line);}
  .seg-btn:last-child{border-right:none;}
  .seg-btn.active{background:var(--teal); color:#fff;}
  .cal-period-label{font-size:15px; font-weight:800; margin:14px 0 10px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-grid-week{grid-template-columns:repeat(7,1fr);}
  .cal-dow{text-align:center; font-size:11.5px; font-weight:800; color:var(--ink-soft); padding:4px 0;}
  .cal-cell{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; min-height:88px;}
  .cal-grid-showall{align-items:start;}
  .cal-cell-tall{min-height:88px; height:auto;}
  .cal-cell.dim{background:#FAFAF9; color:#B5BBC2;}
  .cal-cell.dim .cal-daynum{color:#C4C9CE;}
  .cal-cell.today{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal-soft);}
  .cal-cell-week{min-height:160px;}
  .cal-daynum{font-size:12px; font-weight:800; margin-bottom:4px;}
  .cal-entry{font-size:10.5px; line-height:1.5; padding:2px 4px; border-radius:4px; background:var(--teal-soft); color:var(--ink); margin-bottom:2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cal-entry:hover{background:#D8EEEB;}
  .cal-entry-co{font-weight:800;}
  .cal-more{font-size:10px; color:var(--ink-soft); padding:1px 4px;}

  /* 보고서 */
  .report-controls{display:flex; gap:10px; flex-wrap:wrap;}
  .report-day-label{font-size:13px; font-weight:800; color:var(--steel); margin:14px 0 6px;}

  /* 영업자별 현황 */
  .assignee-co-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
  .assignee-co-head{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin-bottom:8px;}
  .assignee-co-head:hover .company-name-cell{color:var(--teal);}
  .assignee-hist-wrap{margin-top:10px; border-top:1px solid var(--line); padding-top:8px;}
  .quote-total-line{margin-top:12px; padding:12px 16px; background:var(--teal-soft); border-radius:8px; font-size:14px;}

  /* 상담 체크리스트 폼 */
  .intake-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; max-width:760px;}
  .intake-sec{margin-top:22px; padding-top:16px; border-top:1px solid var(--line);}
  .intake-sec:first-child{margin-top:0; padding-top:0; border-top:none;}
  .intake-sec-title{font-size:13.5px; font-weight:800; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .intake-sec-title .mark{color:var(--teal);}
  .intake-sub{font-size:12.5px; font-weight:700; color:var(--steel); margin:12px 0 6px;}
  .chk-row{display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:4px;}
  .chk-item{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink); cursor:pointer;}
  .chk-item input{width:16px;height:16px;accent-color:var(--teal);}
  .qty-row{display:flex; flex-wrap:wrap; gap:14px; margin:6px 0 2px;}
  .qty-item{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);}
  .qty-item input{width:64px;}
  .intake-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .intake-grid .full{grid-column:1/3;}
  .radio-row{display:flex; gap:14px;}
  .radio-item{display:flex; align-items:center; gap:5px; font-size:13px;}
  .contact-box{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:8px; background:#FAFBFA;}
  .prep-doc-note{font-size:12.5px; font-weight:700; color:var(--b-color); background:var(--b-bg); border:1px solid #F3D9B5; border-radius:8px; padding:9px 12px; margin-bottom:4px;}
  .intake-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  @media (max-width:760px){
    .intake-grid{grid-template-columns:1fr;}
    .intake-grid .full{grid-column:1/2;}
  }

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#D3D7D3; border-radius:20px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:12.5px; font-weight:700; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .toast.show{opacity:1;}

  .save-status{position:fixed; top:14px; right:18px; z-index:80; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:20px; background:#fff; border:1px solid var(--line); color:var(--ink-soft); box-shadow:var(--shadow); display:flex; align-items:center; gap:6px; opacity:0; transition:opacity .25s ease;}
  .save-status.visible{opacity:1;}

// 저장 요청이 겹치지 않도록 큐로 묶어서 순차 처리하고, 실패 시 자동 재시도한다.
let _saveInFlight = false;
let _saveQueued = false;
async function saveData(){
  _saveQueued = true;
  if(_saveInFlight) return;
  _saveInFlight = true;
  while(_saveQueued){
    _saveQueued = false;
    const snapshot = JSON.parse(JSON.stringify(STATE.companies)); // 전송 시점 스냅샷
    setSaveStatus("saving");
    const ok = await saveWithRetry(snapshot, 3);
    setSaveStatus(ok ? "ok" : "error");
  }
  _saveInFlight = false;
}
async function saveWithRetry(companiesSnapshot, attemptsLeft){
  try{
    const res = await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 브라우저 preflight(OPTIONS)를 피하기 위해 text/plain 사용
      body: JSON.stringify({ companies: companiesSnapshot })
    });
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data && data.error) || "unknown error");
    return true;
  }catch(e){
    console.error("저장 실패", e);
    if(attemptsLeft > 1){
      await sleep(800);
      return saveWithRetry(companiesSnapshot, attemptsLeft - 1);
    }
    return false;
  }
}

let _statusEl = null;
let _bgRetryTimer = null;
function setSaveStatus(state){
  if(!_statusEl){
    _statusEl = document.createElement("div");
    _statusEl.className = "save-status";
    _statusEl.title = "클릭하면 즉시 다시 저장을 시도해요";
    _statusEl.addEventListener("click", ()=>{ if(_statusEl.classList.contains("error")) saveData(); });
    document.body.appendChild(_statusEl);
  }
  clearTimeout(setSaveStatus._hideTimer);
  const labels = { saving:"구글시트에 저장 중...", ok:"구글시트에 저장됨", error:"저장 실패 · 클릭해서 재시도" };
  _statusEl.className = "save-status visible " + state;
  _statusEl.style.cursor = state === "error" ? "pointer" : "default";
  _statusEl.innerHTML = "";
  _statusEl.appendChild(el("span",{class:"sdot"}));
  _statusEl.appendChild(document.createTextNode(labels[state] || ""));

  if(state === "ok"){
    setSaveStatus._hideTimer = setTimeout(()=>{ _statusEl.classList.remove("visible"); }, 2200);
    clearInterval(_bgRetryTimer); _bgRetryTimer = null;
    setSaveStatus._warned = false;
  }
  if(state === "error"){
    if(!setSaveStatus._warned){
      setSaveStatus._warned = true;
      showToast("구글시트 저장에 실패했어요. Apps Script 배포 상태(액세스 권한: 전체)를 확인해 주세요. 지금 화면 내용은 '데이터 백업'으로도 받아두실 수 있어요.");
    }
    // 30초마다 조용히 자동 재시도 (백엔드가 복구되면 자동으로 다시 저장됨)
    if(!_bgRetryTimer){
      _bgRetryTimer = setInterval(()=>{ saveData(); }, 30000);
    }
  }
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function csvEscape(v){
  if(v==null) v="";
  v = String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}

  const sorted = STATE.companies.slice().sort((a,b)=>{

    if(a.dropped!==b.dropped) return a.dropped?1:-1;
    return LEVELS.indexOf(a.level)-LEVELS.indexOf(b.level);
  });
  sorted.forEach(c=>{
    const histSorted = (c.history||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const last = histSorted[0];
    rows.push([

  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");

/* ===================== 렌더 ===================== */
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="class") e.className = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==="html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function computeWeekOptions(historyList){
  const map = new Map();
  historyList.forEach(h=>{
    if(!h.date) return;
    const d = new Date(h.date+"T00:00:00");
    if(isNaN(d.getTime())) return;
    const mon = getMonday(d);
    const key = ymd(mon);
    if(!map.has(key)) map.set(key, {key, start:mon});
  });
  return Array.from(map.values()).sort((a,b)=> b.start - a.start);
}
function weekLabelFull(mon){
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt = (x)=> x.getFullYear()+"년 "+(x.getMonth()+1)+"월 "+x.getDate()+"일";
  return fmt(mon)+" ~ "+fmt(sun);
}

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day===0 ? -6 : 1);
  const monday = new Date(date);
  monday.setDate(diff);
  monday.setHours(0,0,0,0);
  return monday;
}
function formatWeekLabel(dateStr){
  if(!dateStr) return "날짜 미상";
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d.getTime())) return "날짜 미상";
  const mon = getMonday(d);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt = (x)=> (x.getMonth()+1)+"월 "+x.getDate()+"일";
  return fmt(mon)+" ~ "+fmt(sun);
}

  if(STATE.filterLevel) items = items.filter(c=>c.level===STATE.filterLevel);
  if(STATE.filterStage === "dropped") items = items.filter(c=>c.dropped);
  else if(STATE.filterStage) items = items.filter(c=>!c.dropped && c.stage===STATE.filterStage);

  items = items.slice().sort((a,b)=>{
    if(a.dropped !== b.dropped) return a.dropped ? 1 : -1;
    const li = LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level);
    if(li!==0) return li;
    return (STAGE_INDEX[b.stage]||0) - (STAGE_INDEX[a.stage]||0);
  });

  if(items.length===0){
    return el("div",{class:"empty-state"}, el("b",null,"조건에 맞는 업체가 없어요."), el("div",null,"필터를 조정하거나 새 업체를 추가해 보세요."));
  }

  const table = el("table",{class:"pipeline-table"});
  table.appendChild(el("tr",null, el("th",null,"업체명"), el("th",null,"레벨"), el("th",null,"진행 단계"), el("th",null,"담당자"), el("th",null,"실무 연락처")));
  items.forEach(c=>{
    const row = el("tr",{onclick:()=>{STATE.modalId=c.id; render();}},
      el("td",{class:"company-name-cell"}, c.name),
      el("td",null, el("span",{class:"level-tag "+(c.dropped?"DROP":c.level)}, c.dropped?"DROP":c.level)),
      el("td",null, stageProgress(c)),
      el("td",null, c.assignee ? el("span",{class:"assignee-chip"}, c.assignee) : el("span",{class:"assignee-chip empty"}, "미지정")),
      el("td",null, c.managerName ? (c.managerName+(c.managerPhone?" · "+c.managerPhone:"")) : "-")
    );
    table.appendChild(row);
  });
  return table;
}

function ic(labelText, checked, onChange){
  const input = el("input",{type:"checkbox"});
  input.checked = !!checked;
  input.addEventListener("change", e=>onChange(e.target.checked));
  return el("label",{class:"chk-item"}, input, labelText);
}
function icText(value, onChange, placeholder){
  const i = el("input",{type:"text", placeholder:placeholder||""});
  i.value = value||"";
  i.addEventListener("input", e=>onChange(e.target.value));
  return i;
}
function radioGroup(name, value, onChange){
  const wrap = el("div",{class:"radio-row"});
  ["NO","YES"].forEach(v=>{
    const r = el("input",{type:"radio", name:name});
    r.checked = value===v;
    r.addEventListener("change", ()=>{ if(r.checked) onChange(v); });
    wrap.appendChild(el("label",{class:"radio-item"}, r, v));
  });
  return wrap;
}

function saveIntakeChecklist(){
  const f = STATE.intakeForm;
  if(!f.companyName.trim()){ showToast("계약 업체명을 입력해 주세요"); return; }
  const selected = REQUEST_ITEM_MAP.filter(([key])=>f.items[key]).map(([,,cat])=>cat);
  if(selected.length===0){ showToast("요청 품목을 한 개 이상 선택해 주세요"); return; }

  selected.forEach(cat=>{
    let comp = STATE.companies.find(c=>c.category===cat && c.name===f.companyName.trim());
    if(!comp){
      comp = mk(cat, f.companyName.trim(), "B", "consult", false, "");
      STATE.companies.push(comp);
    }
    if(f.gitRep) comp.assignee = f.gitRep;
    if(f.procName) comp.managerName = f.procName;
    if(f.procPhone) comp.managerPhone = f.procPhone;
    if(f.procEmail) comp.managerEmail = f.procEmail;
    if(f.businessCard) comp.businessCard = f.businessCard;
    comp.intake = JSON.parse(JSON.stringify(f));
    comp.history = comp.history || [];
    comp.history.unshift({date: today(), text: "신규 상담 체크리스트 등록/업데이트 (GIT 담당: "+(f.gitRep||"-")+")"});
  });

  saveData();
  showToast("["+f.companyName+"] "+selected.join(", ")+" 공종에 저장했어요");
  STATE.intakeForm = freshIntakeForm();
  render();
}

function escapeHtml(s){

}

function normalizeCoName(name){
  if(!name) return "";
  let n = String(name);
  n = n.split("/")[0];
  n = n.replace(/\(주\)|㈜|주식회사|\(유\)/g, "");
  n = n.replace(/\([^)]*\)/g, "");
  n = n.replace(/\s+/g, "");
  return n.trim();
}
function cleanCoName(name){
  return String(name||"").replace(/\(주\)|㈜|주식회사/g, "").trim() || name;
}
function parsePastedGrid(text){
  return text.split(/\r?\n/).filter(l=>l.trim()!=="").map(l=>l.split("\t"));
}

// 붙여넣은 데이터를 실제 STATE.companies와 병합(이름 일치 시 갱신, 없으면 신규 추가)한 뒤 저장한다.
function runDbImport(rows, targetCategory){
  let matched = 0, added = 0;
  rows.forEach(cols=>{
    const rawName = (cols[0]||"").trim();
    if(!rawName) return;
    const norm = normalizeCoName(rawName);
    if(!norm) return;

    let comp = STATE.companies.find(c=> c.category===targetCategory && normalizeCoName(c.name)===norm);
    if(!comp){
      comp = mk(targetCategory, cleanCoName(rawName), "B", "consult", false, "");
      STATE.companies.push(comp);
      added++;
    } else {
      matched++;
    }

    if(cols[2]) comp.address = cols[2].trim();
    if(cols[3]) comp.ceoName = cols[3].trim();
    if(cols[4]) comp.ceoPhone = cols[4].trim();
    if(cols[17]) comp.managerName = cols[17].trim();
    const phone = (cols[19]||"").trim() || (cols[20]||"").trim();
    if(phone) comp.managerPhone = phone;
    if(cols[21]) comp.managerEmail = cols[21].trim();
    if(cols[28]) comp.assignee = cols[28].trim();

    const progress = (cols[27]||"").trim();
    if(progress){
      comp.history = comp.history || [];
      const already = comp.history.some(h=>h.text === "[DB_MAS 가져오기] "+progress);
      if(!already) comp.history.unshift({date: today(), text: "[DB_MAS 가져오기] "+progress});
    }
    const masRequest = (cols[30]||"").trim();
    if(masRequest){
      comp.history = comp.history || [];
      const tag = "[MAS등록 요청사항] "+masRequest;
      if(!comp.history.some(h=>h.text===tag)) comp.history.unshift({date: today(), text: tag});
    }
  });
  saveData();
  return { matched, added };
}

function gatherAllHistory(){
  const list = [];
  STATE.companies.forEach(c=>{
    (c.history||[]).forEach(h=> list.push({
      date: h.date||"", text: h.text||"", name: c.name, category: c.category,
      assignee: c.assignee||"", companyId: c.id, level: c.level, stage: c.stage, dropped: c.dropped
    }));
  });
  return list;
}

function shiftDate(d, amount, mode){
  const nd = new Date(d);
  if(mode==="month"){ nd.setMonth(nd.getMonth() + (amount>0?1:-1)); }
  else { nd.setDate(nd.getDate()+amount); }
  return nd;
}
// 로컬 타임존 기준으로 YYYY-MM-DD 문자열을 만든다. (toISOString은 UTC로 변환되어 한국(UTC+9)에서 날짜가 하루 밀리는 버그가 있어 사용하지 않음)
function ymd(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function calEntryLine(h){
  const txt = h.text.length>10 ? h.text.slice(0,10)+"…" : h.text;
  return el("div",{class:"cal-entry", title:h.name+" · "+h.category+" — "+h.text, onclick:(e)=>{ e.stopPropagation(); STATE.modalId=h.companyId; render(); }},
    el("span",{class:"cal-entry-co"}, h.name), " · ", h.category, ": ", txt
  );
}
function buildMonthGrid(anchor, byDate, showAll){
  const year = anchor.getFullYear(), month = anchor.getMonth();
  const first = new Date(year, month, 1);
  const startDate = new Date(year, month, 1 - first.getDay());
  const todayStr = ymd(new Date());
  const grid = el("div",{class:"cal-grid"+(showAll?" cal-grid-showall":"")});
  ["일","월","화","수","목","금","토"].forEach(d=> grid.appendChild(el("div",{class:"cal-dow"}, d)));
  for(let i=0;i<42;i++){
    const d = new Date(startDate); d.setDate(startDate.getDate()+i);
    const dStr = ymd(d);
    const inMonth = d.getMonth()===month;
    const entries = (byDate[dStr]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const cell = el("div",{class:"cal-cell"+(inMonth?"":" dim")+(dStr===todayStr?" today":"")+(showAll?" cal-cell-tall":"")});
    cell.appendChild(el("div",{class:"cal-daynum"}, String(d.getDate())));
    if(showAll){
      entries.forEach(h=> cell.appendChild(calEntryLine(h)));
    } else {
      const shown = entries.slice(0,3);
      shown.forEach(h=> cell.appendChild(calEntryLine(h)));
      if(entries.length>3) cell.appendChild(el("div",{class:"cal-more"}, "+"+(entries.length-3)+"개 더"));
    }
    grid.appendChild(cell);
  }
  return grid;
}
function buildWeekGrid(mon, byDate){
  const todayStr = ymd(new Date());
  const grid = el("div",{class:"cal-grid cal-grid-week"});
  ["월","화","수","목","금","토","일"].forEach(d=> grid.appendChild(el("div",{class:"cal-dow"}, d)));
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const dStr = ymd(d);
    const entries = (byDate[dStr]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    const cell = el("div",{class:"cal-cell cal-cell-week"+(dStr===todayStr?" today":"")});
    cell.appendChild(el("div",{class:"cal-daynum"}, (d.getMonth()+1)+"/"+d.getDate()));
    if(entries.length===0){
      cell.appendChild(el("div",{style:"font-size:11px;color:#C4C9CE;"}, "-"));
    } else {
      entries.forEach(h=> cell.appendChild(calEntryLine(h)));
    }
    grid.appendChild(cell);
  }
  return grid;
}

function recentWeekOptions(n){
  const list = [];
  const mon = getMonday(new Date());
  for(let i=0;i<n;i++){
    const start = new Date(mon); start.setDate(mon.getDate() - i*7);
    list.push({ key: ymd(start), start });
  }
  return list;
}
function recentMonthOptions(n){
  const list = [];
  const now = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    list.push({ key, label:d.getFullYear()+"년 "+(d.getMonth()+1)+"월", start:d, end:new Date(d.getFullYear(), d.getMonth()+1, 0) });
  }
  return list;
}

// 특정 오프셋 개월의 시작일/종료일/라벨 계산 (0=이번달, -1=지난달)
function monthRange(offsetMonths){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()+offsetMonths, 1);
  return {
    start: new Date(d.getFullYear(), d.getMonth(), 1),
    end: new Date(d.getFullYear(), d.getMonth()+1, 0),
    label: d.getFullYear()+"년 "+(d.getMonth()+1)+"월"
  };
}
function inRange(dateStr, start, end){
  if(!dateStr) return false;
  const d = new Date(dateStr+"T00:00:00");
  return !isNaN(d.getTime()) && d>=start && d<=end;
}
// 공종별로 전월/금월의 "신규 등록 업체 수"와 "업무 처리 건수"를 비교한다.
// (총 보유 업체수는 과거 시점 스냅샷이 없어 정확한 재현이 불가능하므로, 실제 기록된 히스토리 날짜를 기준으로
//  신규업체 등록 시점과 업무 처리 건수를 집계하는 방식으로 월별 비교를 제공한다.)
function buildMonthComparisonData(){
  const cur = monthRange(0), prev = monthRange(-1);
  const rows = CATEGORIES.map(cat=>{
    const items = STATE.companies.filter(c=>c.category===cat);
    let curNew=0, prevNew=0, curAct=0, prevAct=0;
    items.forEach(c=>{
      const hist = c.history||[];
      let earliest = null;
      hist.forEach(h=>{
        if(h.date && (!earliest || h.date<earliest)) earliest = h.date;
        if(inRange(h.date, cur.start, cur.end)) curAct++;
        if(inRange(h.date, prev.start, prev.end)) prevAct++;
      });
      if(earliest && inRange(earliest, cur.start, cur.end)) curNew++;
      if(earliest && inRange(earliest, prev.start, prev.end)) prevNew++;
    });
    return { cat, curNew, prevNew, curAct, prevAct };
  });
  return { curLabel: cur.label, prevLabel: prev.label, rows };
}
function diffBadge(n){
  if(n>0) return el("span",{style:"color:#0F766E;font-weight:800;"}, "▲"+n);
  if(n<0) return el("span",{style:"color:#DC2626;font-weight:800;"}, "▼"+Math.abs(n));
  return el("span",{style:"color:var(--ink-soft);"}, "-");
}
function diffText(n){
  if(n>0) return "▲"+n;
  if(n<0) return "▼"+Math.abs(n);
  return "-";
}

function buildSummaryTable(){
  const { curLabel, prevLabel, rows } = buildMonthComparisonData();
  const table = el("table",{class:"pipeline-table"});
  table.appendChild(el("tr",null,
    el("th",null,"공종"),
    el("th",null,prevLabel+" 신규"), el("th",null,curLabel+" 신규"), el("th",null,"증감"),
    el("th",null,prevLabel+" 업무건수"), el("th",null,curLabel+" 업무건수"), el("th",null,"증감")
  ));
  rows.forEach(r=>{
    table.appendChild(el("tr",null,
      el("td",{class:"company-name-cell"}, r.cat),
      el("td",null, String(r.prevNew)),
      el("td",null, String(r.curNew)),
      el("td",null, diffBadge(r.curNew-r.prevNew)),
      el("td",null, String(r.prevAct)),
      el("td",null, String(r.curAct)),
      el("td",null, diffBadge(r.curAct-r.prevAct)),
    ));
  });
  return table;
}

function buildDayGroups(rangeStart, rangeEnd){
  const allHistory = gatherAllHistory();
  const byDate = {};
  allHistory.forEach(h=>{ if(!h.date) return; (byDate[h.date]=byDate[h.date]||[]).push(h); });
  const groups = [];
  const cursor = new Date(rangeStart);
  while(cursor <= rangeEnd){
    const dStr = ymd(cursor);
    const items = (byDate[dStr]||[]).slice().sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
    groups.push({ date:dStr, label: dStr+" ("+["일","월","화","수","목","금","토"][cursor.getDay()]+")", items });
    cursor.setDate(cursor.getDate()+1);
  }
  return groups;
}
function buildDayTable(items){
  const table = el("table",{class:"pipeline-table", style:"margin-bottom:14px;"});
  table.appendChild(el("tr",null, el("th",null,"업체명"), el("th",null,"공종"), el("th",null,"레벨"), el("th",null,"진행 단계"), el("th",null,"담당자"), el("th",null,"진행 내용")));
  items.forEach(h=>{
    table.appendChild(el("tr",{onclick:()=>{ STATE.modalId=h.companyId; render(); }},
      el("td",{class:"company-name-cell"}, h.name),
      el("td",null, h.category),
      el("td",null, el("span",{class:"level-tag "+(h.dropped?"DROP":h.level)}, h.dropped?"DROP":h.level)),
      el("td",null, h.dropped?"DROP":stageLabel(h.stage)),
      el("td",null, h.assignee||"-"),
      el("td",null, h.text)
    ));
  });
  return table;
}

function openReportPrintView(periodLabel, dayGroups){
  const { curLabel, prevLabel, rows } = buildMonthComparisonData();

  ).join("");

  const dayHtml = dayGroups.filter(g=>g.items.length>0).map(g=>{
    const rows = g.items.map(h=>
      "<tr><td class='left'>"+escapeHtml(h.name)+"</td><td>"+escapeHtml(h.category)+"</td><td>"+(h.dropped?"DROP":h.level)+"</td><td>"+(h.dropped?"DROP":escapeHtml(stageLabel(h.stage)))+"</td><td>"+escapeHtml(h.assignee||"-")+"</td><td class='left'>"+escapeHtml(h.text)+"</td></tr>"

  specWindowShell("주간/월간 보고서 · "+periodLabel, `

    <h2 style="font-size:14px;margin:18px 0 8px;">일별 업무 내역</h2>
    ${dayHtml || "<div class='note'>해당 기간에 기록된 업무 내용이 없어요.</div>"}
  `, "GIT Green IT Korea · MAS 영업 파이프라인 업무 보고서");
}

function exportReportExcel(periodLabel, dayGroups){
  const { curLabel, prevLabel, rows: cmpRows } = buildMonthComparisonData();
  const rows = [["구분","공종",prevLabel+" 신규",curLabel+" 신규","신규 증감",prevLabel+" 업무건수",curLabel+" 업무건수","업무건수 증감"]];
  cmpRows.forEach(r=>{
    rows.push(["요약", r.cat, r.prevNew, r.curNew, diffText(r.curNew-r.prevNew), r.prevAct, r.curAct, diffText(r.curAct-r.prevAct)]);
  });
  rows.push([]);
  rows.push(["날짜","업체명","공종","레벨","진행단계","담당자","진행 내용"]);
  dayGroups.forEach(g=>{
    g.items.forEach(h=>{
      rows.push([g.date, h.name, h.category, h.dropped?"DROP":h.level, h.dropped?"DROP":stageLabel(h.stage), h.assignee||"", h.text]);
    });
  });
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  downloadBlob("\uFEFF"+csv, "MAS_보고서_"+periodLabel.replace(/[^0-9a-zA-Z가-힣]/g,"")+"_"+today()+".csv", "text/csv;charset=utf-8;");
  showToast("보고서를 다운로드했어요");
}

function computeQuoteTotal(items){
  return (items||[]).reduce((sum,it)=> sum + (Number(it.qty)||0)*(Number(it.unitPrice)||0), 0);
}
function computeQuoteDiscountedTotal(items){
  return (items||[]).reduce((sum,it)=>{
    const amount = (Number(it.qty)||0)*(Number(it.unitPrice)||0);
    const rate = Number(it.discountRate)||0;
    return sum + amount * (1 - rate/100);
  }, 0);
}
function formatWon(n){ return (Number(n)||0).toLocaleString("ko-KR")+"원"; }

// 숫자를 한글 금액(예: 이천삼백구십일만사천오백오십일원정)으로 변환
function numberToKoreanWon(num){
  num = Math.round(Number(num)||0);
  if(num === 0) return "영원정";
  const digits = ["","일","이","삼","사","오","육","칠","팔","구"];
  const smallUnits = ["","십","백","천"];
  const bigUnits = ["","만","억","조","경"];
  let n = num;
  let result = "";
  let groupIndex = 0;
  while(n > 0){
    const group = n % 10000;
    if(group > 0){
      let groupStr = "";
      let g = group, pos = 0;
      while(g > 0){
        const d = g % 10;
        if(d > 0){
          groupStr = (d===1 && pos>0 ? "" : digits[d]) + smallUnits[pos] + groupStr;
        }
        g = Math.floor(g/10);
        pos++;
      }
      result = groupStr + bigUnits[groupIndex] + result;
    }
    n = Math.floor(n/10000);
    groupIndex++;
  }
  return result + "원정";
}

function exportQuoteExcel(f){
  const rows = [
    ["견적번호", f.id], ["일자", f.date], ["수신", f.clientName], ["건명", f.projectName],
    ["영업담당자", f.salesRep], ["견적담당자", f.quoteRep], ["납품장소", f.deliveryPlace],
    ["견적유효기간", f.validPeriod], ["결제조건", f.paymentTerms], []
  ];
  rows.push(["No","품명","모델명","수량","단가","금액"]);
  (f.items||[]).forEach((it,i)=> rows.push([i+1, it.name||"", it.model||"", it.qty||0, it.unitPrice||0, (it.qty||0)*(it.unitPrice||0)]));
  rows.push([]);
  rows.push(["합계금액","","","","", computeQuoteTotal(f.items)]);
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  downloadBlob("\uFEFF"+csv, "견적서_"+(f.clientName||"무제")+"_"+f.date+".csv", "text/csv;charset=utf-8;");
  showToast("다운로드했어요");
}

// 이미지 파일을 받아 리사이즈/압축한 뒤 base64 dataURL로 콜백에 전달
function compressImageToDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// 파일을 순수 base64 문자열로 변환 (Drive 업로드용, data: 접두어 제거)
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const result = reader.result;
      const idx = result.indexOf(",");
      resolve(idx>=0 ? result.slice(idx+1) : result);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ATTACH_ICON = {
  "application/pdf":"📕", "image/":"🖼️",
  "application/msword":"📄", "application/vnd.openxmlformats-officedocument.wordprocessingml.document":"📄",
  "application/vnd.ms-excel":"📊", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"📊"
};
function attachIconFor(mimeType){
  if(!mimeType) return "📎";
  if(mimeType.startsWith("image/")) return "🖼️";
  return ATTACH_ICON[mimeType] || "📎";
}

// 업체 상세 - 첨부파일(상담자료/서류) 업로드 UI. 구글 드라이브에 저장되고 시트에는 링크만 남는다.
function attachmentsField(company, autoSave){
  const wrap = el("div");
  const list = el("div",{class:"attach-list"});
  const statusMsg = el("div",{class:"attach-status"});

  function renderList(){
    list.innerHTML = "";
    const atts = company.attachments || [];
    if(!atts.length){
      list.appendChild(el("div",{style:"color:var(--ink-soft);font-size:12.5px;padding:6px 0;"}, "첨부된 자료가 없어요."));
      return;
    }
    atts.forEach((a, idx)=>{
      list.appendChild(el("div",{class:"attach-item"},
        el("a",{class:"attach-link", href:a.url, target:"_blank", rel:"noopener"}, attachIconFor(a.mimeType)+" "+a.name),
        el("span",{class:"attach-date"}, a.addedDate||""),
        el("button",{class:"history-del", onclick:()=>{
          atts.splice(idx,1);
          renderList();
          autoSave();
        }}, "삭제")
      ));
    });
  }
  renderList();

  const fileInput = el("input",{type:"file", multiple:"multiple", accept:"image/*,application/pdf,.doc,.docx,.xls,.xlsx,.hwp"});
  fileInput.addEventListener("change", async (e)=>{
    const files = Array.from(e.target.files || []);
    fileInput.value = "";
    for(const file of files){
      if(file.size > 10*1024*1024){
        showToast("["+file.name+"] 파일이 너무 커요 (10MB 이하만 업로드 가능)");
        continue;
      }
      statusMsg.textContent = "["+file.name+"] 업로드 중...";
      try{
        const base64 = await fileToBase64(file);
        const res = await fetch(SHEETS_URL, {
          method:"POST",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({ type:"upload", fileName:file.name, mimeType:file.type, dataBase64:base64, companyId:company.id })
        });
        const data = await res.json();
        if(data && data.ok){
          if(!company.attachments) company.attachments = [];
          company.attachments.push({ id:data.id, name:data.name, url:data.url, mimeType:file.type, addedDate:today() });
          renderList();
          autoSave();
        } else {
          showToast("["+file.name+"] 업로드 실패: "+((data&&data.error)||"알 수 없는 오류"));
        }
      }catch(err){
        console.error("첨부파일 업로드 실패", err);
        showToast("["+file.name+"] 업로드 중 오류가 발생했어요");
      }
    }
    statusMsg.textContent = "";
  });

  wrap.appendChild(list);
  wrap.appendChild(el("div",{style:"margin-top:8px;"}, fileInput));
  wrap.appendChild(statusMsg);
  wrap.appendChild(el("div",{style:"font-size:11px;color:var(--ink-soft);margin-top:6px;"}, "이미지·PDF·워드·엑셀·한글 파일 지원 (파일당 10MB 이하). 구글 드라이브의 'MAS_첨부파일' 폴더에 저장돼요."));
  return wrap;
}

function field(labelText, inputEl){
  return el("div",{class:"field"}, el("label",null, labelText), inputEl);
}
function input(type, value, onChange, placeholder, onCommit){
  const i = el("input",{type, placeholder: placeholder||""});
  i.value = value||"";
  i.addEventListener("input", e=>onChange(e.target.value));
  if(onCommit) i.addEventListener("change", onCommit); // 포커스를 벗어날 때(blur) 저장
  return i;
}
function selectEl(options, value, onChange){
  const s = el("select",{onchange:(e)=>onChange(e.target.value)});
  options.forEach(o=>{
    const opt = el("option",{value:o}, o);
    if(o===value) opt.setAttribute("selected","selected");
    s.appendChild(opt);
  });
  return s;
}
function checkbox(checked, onChange){
  const c = el("input",{type:"checkbox"});
  c.checked = checked;
  c.style.width="16px"; c.style.height="16px"; c.style.accentColor="var(--teal)";
  c.addEventListener("change", e=>onChange(e.target.checked));
  return c;
}
function levelPicker(company, onChange){
  const wrap = el("div",{class:"level-picker"});
  LEVELS.forEach(l=>{
    const btn = el("button",{type:"button", class:"level-btn "+l+(company.level===l?" active":""), onclick:(e)=>{
      company.level = l;
      wrap.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("active"));
      e.currentTarget.classList.add("active");
      if(onChange) onChange();
    }}, l+" LEVEL");
    wrap.appendChild(btn);
  });
  return wrap;
}
function stagePicker(company, onChange){
  const wrap = el("div",{class:"stage-picker"});
  STAGES.forEach(s=>{
    const btn = el("button",{type:"button", class:"stage-btn"+(company.stage===s.id?" active":""), onclick:(e)=>{
      company.stage = s.id;
      wrap.querySelectorAll(".stage-btn").forEach(b=>b.classList.remove("active"));
      e.currentTarget.classList.add("active");
      if(onChange) onChange();
    }}, s.label);
    wrap.appendChild(btn);
  });
  return wrap;
}
